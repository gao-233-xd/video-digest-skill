[bilibili]
; B站登录Cookie（强烈建议配置，否则无法获取官方AI字幕、截图最高只有480P）
; 获取方法：浏览器登录B站 → F12 → Application → Cookies → https://www.bilibili.com
; → 找到 SESSDATA，复制它的值粘贴到这里
SESSDATA=
; buvid3 可留空（工具会自动生成一个随机值）

[whisper]
; 本地转写语言: auto=自动检测, 中文视频可固定 zh
language=auto
; 本地转写模型: medium（更准，首次下载约1.5GB）/ small（更快，约0.5GB）
model=medium

[frames]
; ffmpeg 场景检测阈值 0~1，越小截帧越多
scene_threshold=0.3
; 画面基本静止时，每隔多少秒兜底截一张
fallback_interval=240
